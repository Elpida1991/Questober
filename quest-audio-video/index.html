<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090d">
<title>QUESTOBER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--panel:#0c1016;--panel-soft:#10151c;--line:#28303a;--line-bright:#3b4551;--text:#f0f2f4;--text-soft:#c4cad1;--muted:#78818c;--error:#e05252;--success:#2cc779;--cyan:#62cfff;--shadow:rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%}
body{min-height:100vh;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),var(--bg);background-size:40px 40px;color:var(--text);font-family:"IBM Plex Mono",monospace;overflow-x:hidden}
.system-header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px 26px;color:#69727d;font-size:10px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none;z-index:10}
.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:90px 20px 50px}
.screen{width:min(720px,100%);display:none;position:relative;padding:48px 52px;background:rgba(12,16,22,.96);border:1px solid var(--line);box-shadow:0 24px 70px var(--shadow);animation:screenIn .35s ease both}
.screen.active{display:block}.screen::before{content:"";position:absolute;top:-1px;left:40px;width:80px;height:2px;background:var(--text)}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.screen-label{display:inline-flex;align-items:center;min-height:28px;padding:0 11px;border:1px solid var(--line-bright);background:var(--panel-soft);color:var(--text-soft);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
h1,h2,p{margin:0}.headline{margin-top:30px;font-size:clamp(25px,4vw,34px);line-height:1.3;font-weight:400;letter-spacing:-.025em}
.body-text{margin-top:22px;color:var(--text-soft);font-size:14px;line-height:1.8}
.logo-wrap{width:100%;display:flex;justify-content:flex-start;align-items:center;overflow:hidden;margin-top:22px}.logo{width:min(620px,100%);height:auto;display:block;mix-blend-mode:screen;filter:brightness(1.05) contrast(1.04)}
.date-line{margin-top:8px;color:var(--text-soft);font-size:13px;letter-spacing:.17em}
.system-button{appearance:none;border:1px solid var(--line-bright);background:transparent;color:var(--text);padding:13px 22px;font-family:inherit;font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.system-button:hover{background:rgba(255,255,255,.045);border-color:#69737e;transform:translateY(-1px)}.system-button:active{transform:translateY(0)}
.primary-row{display:flex;justify-content:center;margin-top:30px}.primary-button{min-width:min(300px,100%);padding:16px 24px;border-color:#4a6b7d;letter-spacing:.18em}.primary-button:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(98,207,255,.08)}
.audio-shell{margin-top:30px;border:1px solid var(--line);background:#090d12;padding:18px}
.audio-kicker{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-bottom:16px}
audio{display:block;width:100%;height:42px;accent-color:#70cfff}
.audio-actions{display:flex;justify-content:center;margin-top:24px}
.secondary-actions{display:flex;justify-content:flex-end;margin-top:14px}
.hint-button{border:0;background:transparent;color:#8d9aa7;padding:8px 0 4px 12px;font:500 10px "IBM Plex Mono",monospace;letter-spacing:.16em;cursor:pointer;text-decoration:none}
.hint-button:hover{color:var(--cyan);text-shadow:0 0 12px rgba(98,207,255,.25)}
.video-frame{margin-top:28px;background:#03070b;border:1px solid var(--line);padding:8px;box-shadow:inset 0 0 24px rgba(0,0,0,.55)}
video{display:block;width:100%;height:auto;max-height:70vh;background:#03070b}
.back-row{display:flex;justify-content:center;margin-top:24px}
.message{margin-top:28px;color:var(--text-soft);font-size:15px;line-height:1.85}.signature{margin-top:30px;color:var(--text);font-size:14px;letter-spacing:.04em;text-align:right}
.code-shell{margin-top:30px;border:1px solid var(--line);background:#090d12;padding:20px}.code-label{display:block;margin-bottom:12px;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.code-input{display:block;width:100%;min-height:52px;border:1px solid var(--line-bright);border-radius:0;background:#070a0e;color:var(--text);padding:12px 14px;font:500 20px "IBM Plex Mono",monospace;letter-spacing:.2em;outline:none}.code-input:focus{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(98,207,255,.12)}.error-message{min-height:18px;margin-top:14px;color:var(--error);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.error-message:empty{display:none}
@media(max-width:680px){.system-header{padding:16px 18px;font-size:8px}.app{padding:75px 14px 30px}.screen{padding:36px 25px}.screen::before{left:28px;width:65px}.headline{font-size:26px}.body-text,.message{font-size:14px}.logo-wrap{margin-top:20px}.audio-shell{padding:13px}.primary-button{width:100%}}
</style>
</head>
<body>
<header class="system-header"><span>QUESTOBER</span><span>OCTUBRE · 2026</span></header>
<main class="app">
<section class="screen active" id="entry" aria-label="Inicio">
  <div class="logo-wrap"><img src="questober-logo.png" alt="QUESTOBER" class="logo"></div>
  <div class="primary-row"><button class="system-button primary-button" data-screen="audio-screen">INICIAR QUEST</button></div>
</section>
<section class="screen" id="audio-screen" aria-label="Audio de la quest">
  <div class="screen-label">QUEST EN CURSO</div>
  <div class="audio-shell">
    <div class="audio-kicker">REPRODUCCIÓN</div>
    <audio id="audio-player" controls preload="metadata">
      <source src="pista-sonora.mp3" type="audio/mpeg">
      Tu navegador no puede reproducir este audio.
    </audio>
  </div>
  <div class="primary-row audio-actions"><button class="system-button primary-button" data-screen="creator-message">CONTINUAR</button></div>
  <div class="secondary-actions"><button class="hint-button" data-screen="video-screen">PISTA</button></div>
</section>
<section class="screen" id="video-screen" aria-label="Pista visual">
  <div class="screen-label">PISTA</div>
  <div class="video-frame">
    <video id="video-player" controls playsinline preload="none">
      <source src="pista-visual.mp4" type="video/mp4">
      Tu navegador no puede reproducir este vídeo.
    </video>
  </div>
  <div class="back-row"><button class="system-button" data-screen="audio-screen" id="back-button">VOLVER</button></div>
</section>
<section class="screen" id="transcribe-screen" aria-label="Transcribe la información descifrada">
  <div class="screen-label">VERIFICACIÓN REQUERIDA</div>
  <h1 class="headline">Transcribe la información descifrada</h1>
  <p class="body-text">Introduce el dato revelado para continuar.</p>
  <form id="transcribe-form">
    <div class="code-shell">
      <label class="code-label" for="decoded-number">INFORMACIÓN DESCIFRADA</label>
      <input class="code-input" id="decoded-number" name="decoded-number" type="text" inputmode="numeric" autocomplete="off" maxlength="4" aria-describedby="code-error" required>
      <p class="error-message" id="code-error" role="status" aria-live="polite"></p>
    </div>
    <div class="primary-row"><button class="system-button primary-button" type="submit">VERIFICAR</button></div>
  </form>
</section>
<section class="screen" id="creator-message" aria-label="Mensaje de la Creadora">
  <div class="screen-label">AVISO DEL SISTEMA</div>
  <p class="message">La información es correcta.</p>
  <p class="message">Pero, ¿y si no se trata de un código?</p>
  <p class="message">¿Sabes lo que tienes que hacer?</p>
  <p class="signature">— LA CREADORA</p>
</section>
</main>
<script>
(() => {
 const screens=[...document.querySelectorAll('.screen')];
 const audio=document.getElementById('audio-player');
 const video=document.getElementById('video-player');
 function showScreen(id){
   const target=document.getElementById(id);
   if(!target)return;
   if(id!=='video-screen'){video.pause();}
   if(id!=='audio-screen'){audio.pause();}
   if(id==='video-screen'){video.load();}
   screens.forEach(s=>s.classList.toggle('active',s===target));
   window.scrollTo({top:0,behavior:'smooth'});
 }
 document.querySelectorAll('[data-screen]').forEach(button=>{
   button.addEventListener('click',()=>showScreen(button.dataset.screen));
 });
 document.getElementById('back-button').addEventListener('click',()=>{video.pause();showScreen('audio-screen');});
 const form=document.getElementById('transcribe-form');
 const field=document.getElementById('decoded-number');
 const error=document.getElementById('code-error');
 let errorTimer;
 document.querySelector('[data-screen="creator-message"]').dataset.screen='transcribe-screen';
 form.addEventListener('submit',event=>{
   event.preventDefault();
   clearTimeout(errorTimer);
   if(field.value.trim()==='1800'){
     error.textContent='';
     field.value='';
     showScreen('creator-message');
   }else{
     error.textContent='RESPUESTA INCORRECTA';
     field.value='';
     field.focus();
     errorTimer=setTimeout(()=>{error.textContent='';},1400);
   }
 });
})();
</script>
</body>
</html>
